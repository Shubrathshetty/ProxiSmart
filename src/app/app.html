<div class="app-container">
  <header>
    <h1>📍 Nearby Places</h1>

    <div class="location-status" *ngIf="locationError && !userLocation">
      <p class="error-text">{{ locationError }}</p>
      <div class="manual-input">
        <p>Enter Manual Location:</p>
        <div class="input-group">
          <input #latInput placeholder="Lat (e.g. 40.7128)" value="28.6139">
          <input #lngInput placeholder="Lng (e.g. 77.2090)" value="77.2090">
          <button (click)="setManualLocation(latInput.value, lngInput.value)">Set</button>
        </div>
      </div>
    </div>
    <div class="location-status success" *ngIf="userLocation">
      <small>✅ Location set</small>
    </div>
  </header>

  <main>
    <app-mood-selector (moodSelected)="onMoodSelected($event)"></app-mood-selector>

    <div *ngIf="selectedMood" class="results-section">
      <app-filters [showPriceFilter]="showPriceFilter" (filterChange)="onFiltersChanged($event)">
      </app-filters>

      <app-place-list [places]="displayedPlaces" [isLoading]="isLoading" [hasSearched]="!!selectedMood"
        [error]="searchError">
      </app-place-list>
    </div>
  </main>
</div>
